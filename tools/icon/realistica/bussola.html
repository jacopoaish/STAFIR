// --- diamante taglio brillante visto dall'alto: tavola ottagonale, stella, faccette alternate chiare/scure, piccoli "fuochi" colorati ---

}
function brilliantTop(seed) {

  x.fillStyle = '#000'; x.fillRect(0, 0, 1024, 1024);
