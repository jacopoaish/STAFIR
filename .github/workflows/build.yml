name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache dati geografici
        id: geocache
        uses: actions/cache@v4
        with:
          path: core/src/main/assets/geo/cities.tsv
          key: geonames-cities15000-v1

      - name: Dati geografici offline (GeoNames)
        if: steps.geocache.outputs.cache-hit != 'true'
        run: python3 tools/build_geodata.py

      - name: Test automatici
        run: ./gradlew --no-daemon testDebugUnitTest :domain:test

      - name: Compila APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rinomina APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Stafir-fase1-build${{ github.run_number }}.apk"
          ls -la out

      - name: Carica APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Stafir-build${{ github.run_number }}
          path: out/*.apk

      - name: Pubblica APK scaricabile dal telefono (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Stafir Fase 1 – build ${{ github.run_number }}"
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            APK di prova della Fase 1 (ramo `${{ github.ref_name }}`, commit ${{ github.sha }}).
            Scarica il file .apk qui sotto dal telefono e installalo.
          files: out/*.apk

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
