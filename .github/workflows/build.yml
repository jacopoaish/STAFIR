name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache dati geografici
        id: geocache
        uses: actions/cache@v4
        with:
          path: core/src/main/assets/geo/cities.tsv
          key: geonames-cities15000-v2

      - name: Dati geografici offline (GeoNames)
        if: steps.geocache.outputs.cache-hit != 'true'
        run: python3 tools/build_geodata.py

      - name: Test automatici
        run: ./gradlew --no-daemon testDebugUnitTest :domain:test

      - name: Compila APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Prepara APK
        run: |
          mkdir -p out smoke-apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "out/Stafir-fase1-build${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk smoke-apk/
          ls -la out smoke-apk

      - name: Carica APK telefono
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Carica APK emulatore
        uses: actions/upload-artifact@v4
        with:
          name: smoke-apk
          path: smoke-apk/*.apk

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: smoke-apk
          path: smoke-apk

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache emulatore
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel6-v1

      - name: Prepara emulatore
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulatore pronto"

      - name: Test sull'emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/smoke/smoke_test.sh smoke-apk/app-x86_64-release.apk smoke-out

      - name: Riepilogo
        if: always()
        run: |
          cat smoke-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
          cat smoke-out/report.md || true
          echo "----- log app -----"; cat smoke-out/logcat-app.txt || true
          echo "----- crash -----"; cat smoke-out/crash.txt || true

      - name: Schermate nel log (per la revisione)
        if: always()
        run: |
          pip install --quiet pillow || true
          python3 tools/smoke/print_shots.py smoke-out || true

      - name: Carica screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screens
          path: smoke-out/

  release:
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: emulator-screens
          path: screens

      - name: Raccogli screenshot
        run: |
          mkdir -p shots
          cd screens && zip -q ../shots/schermate-emulatore.zip *.png report.md && cd ..
          ls -la out shots

      - name: Pubblica APK scaricabile dal telefono (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Stafir Fase 1 – build ${{ github.run_number }}"
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body_path: screens/report.md
          files: |
            out/*.apk
            shots/*.zip
